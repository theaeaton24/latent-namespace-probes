name: Developmental humor software tests
on:
  push:
    paths: ['humor-development/**', 'heart-ridge/study.py', '.github/workflows/humor-development-tests.yml']
  pull_request:
    paths: ['humor-development/**', 'heart-ridge/study.py', '.github/workflows/humor-development-tests.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 scikit-learn==1.5.2 matplotlib==3.9.2
      - run: python -m unittest discover -s humor-development/tests -v
